<!DOCTYPE html>
<html lang="pt-BR" data-version="3">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do dado</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
    <link rel="icon" href="./images/dado-3.svg" type="image/x-icon">
</head>

<body>
    <header>
        <button id="change-theme" type="button">
            <img />
        </button>
        <h1 id="title">Jogo do dado</h1>
        <button id="toggle-sidebar-btn" type="button" onclick="toggleSidebar('open')">
            <img />
        </button>
    </header>

    <main>
        <div id="gameboard">
            <div id="players-header">
                <span>Jogadores</span>
                <button type="button" id="unshift-btn"></button>
            </div>
            <div id="score-header">Pontuação</div>
            <div id="total-header">Total</div>


            <div id="add-player-row">
                <input type="text" style="display: none;" placeholder="Digite o nome do jogador..." />
                <button type="button" style="display: none;">
                    <img src="./images/xmark-solid-full.svg" />
                </button>
                <button type="button">
                    <img src="./images/xmark-solid-full.svg" />
                </button>
            </div>
        </div>
    </main>
    <div id="select-score" style=" display: none;">
        <button type="button" id="close-select-score"></button>
        <!-- <div id="fragment"></div> -->
        <div id="dices">
            <button type="button" data-dice="1"><img src="./images/dado-1.svg" /></button>
            <button type="button" data-dice="2"><img src="./images/dado-2.svg" /></button>
            <button type="button" data-dice="3"><img src="./images/dado-3.svg" /></button>
            <button type="button" data-dice="4"><img src="./images/dado-4.svg" /></button>
            <button type="button" data-dice="5"><img src="./images/dado-5.svg" /></button>
            <button type="button" data-dice="6"><img src="./images/dado-6.svg" /></button>
        </div>
    </div>

    <div id="game-over" style="display: none;">
        <div>
            <div>
                <h1></h1>
                <h4>vai tirar o lixo...</h4>
            </div>
            <div>
                <img src="./images/circle-info-solid-full.svg" />
                <h2>O jogo foi salvo no histórico.</h2>
            </div>
        </div>
        <button type="button" id="check-results-button" onclick="event.target.parentNode.style='opacity:0;'">Conferir
            resultado</button>
    </div>

    <!--sidebar-->
    <div class="rcf-sidebar-backdrop" onclick="toggleSidebar('close')">
    </div>

    <div class="rcf-sidebar">
        <h2 style="text-align: center; text-transform: uppercase; color: white;">Histórico</h2>
        <div class="rcf-sidebar-filters">
            <ul style="display: flex;">
                <li>
                    <button onclick="onSelectFilter(1)" class="filter-btn" type="button">D<span>errota</span></button>
                </li>
                <li>
                    <button onclick="onSelectFilter(2)" class="filter-btn" type="button">V<span>itória</span></button>
                </li>
                <li>
                    <button onclick="onSelectFilter(3)" class="filter-btn" type="button">6<span>66</span></button>
                </li>
            </ul>
        </div>
        <ul class="rcf-sidebar-list"></ul>
    </div>

    <div class="modal"></div>
    <div id="version"></div>
    <div id="toast-area"></div>
</body>

</html>
